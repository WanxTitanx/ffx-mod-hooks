name: context-tools

on:
  push:
    branches: [main, 'codex/ffx-hooks-context-*']
    paths: ['tools/context/**', 'docs/ai/**', 'docs/superpowers/**', 'AGENTS.md', 'CLAUDE.md', '.agents/skills/ffx-context/**', '.github/workflows/context.yml', '.gitignore']
  pull_request:
    paths: ['tools/context/**', 'docs/ai/**', 'docs/superpowers/**', 'AGENTS.md', 'CLAUDE.md', '.agents/skills/ffx-context/**', '.github/workflows/context.yml', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and policy tests (no game runtime)
        run: python -W error::ResourceWarning -m unittest discover -s tools/context/tests -v
      - name: Check local prerequisites
        run: python tools/context/ffx_context.py doctor --json
      - name: Index complete checkout
        run: python tools/context/ffx_context.py index --json
      - name: Repository navigation evaluation
        run: python tools/context/ffx_context.py evaluate --json
      - name: Bounded context smoke test
        run: python tools/context/ffx_context.py bundle "DrawPromptGlyph" --max-bytes 24000 > /dev/null
      - name: Confirm source tree remains untouched
        run: git diff --exit-code && git diff --cached --exit-code
