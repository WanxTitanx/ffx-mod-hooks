[speed_hack]
# Ctrl+Shift+K cycles 1x/2x/4x/8x while armed
# Native 2x/4x is armed; this hook does not infer per-scene application
# Custom 8x targets the reviewed field-scene service tick; broader coverage needs RT2
# FMV acceleration is separately opt-in and requires restart
# factor and speed_step are retained as ignored legacy keys
factor = 8.0
max_speed = 8.0
speed_step = 2.0

